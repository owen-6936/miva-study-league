openapi: 3.1.0
info:
  title: MIVA Study League Backend API
  version: 1.0.0
  summary: Backend contract required by the MIVA Study League frontend.
  description: |
    This OpenAPI specification defines the HTTP endpoints required for the frontend
    to operate as a complete full-stack application.

    Base URL in frontend:
    - VITE_API_URL (defaults to http://localhost:3000/api)

    Realtime channel in frontend:
    - VITE_WS_URL (defaults to http://localhost:3000)

    Socket.IO events expected by the frontend are listed under `x-socketio-events`.
servers:
  - url: http://localhost:3000/api
    description: Local development
  - url: https://api.miva-study-league.example/api
    description: Production

tags:
  - name: Auth
  - name: Users
  - name: Teams
  - name: Missions
  - name: Challenges
  - name: Submissions
  - name: Leaderboard
  - name: Scores
  - name: Awards
  - name: Notifications
  - name: Season

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate a user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new student account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Password reset email sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'

  /auth/setup-password:
    post:
      tags: [Auth]
      summary: Setup initial password after invite.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupPasswordRequest'
      responses:
        '200':
          description: Initial password setup success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access and refresh tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New tokens returned in wrapper object expected by frontend interceptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current user.
      responses:
        '200':
          description: Logout success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user profile.
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      summary: List users.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: role
          schema:
            $ref: '#/components/schemas/UserRole'
      responses:
        '200':
          description: Paginated users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by id.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: User profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Update user profile.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags: [Users]
      summary: Delete user.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: User deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'

  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Update user role (admin only).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'

  /teams:
    get:
      tags: [Teams]
      summary: List all teams.
      responses:
        '200':
          description: Team list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
    post:
      tags: [Teams]
      summary: Create team (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Team created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'

  /teams/{id}:
    get:
      tags: [Teams]
      summary: Get team detail.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Team details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
    patch:
      tags: [Teams]
      summary: Update team.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          description: Updated team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'

  /teams/{id}/join:
    post:
      tags: [Teams]
      summary: Join a team.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Joined team details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'

  /teams/{id}/leave:
    post:
      tags: [Teams]
      summary: Leave a team.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Left team successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'

  /teams/{id}/transfer:
    post:
      tags: [Teams]
      summary: Transfer to another team.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferTeamRequest'
      responses:
        '200':
          description: Transfer success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'

  /teams/{id}/roles:
    patch:
      tags: [Teams]
      summary: Update team role assignments.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRolesRequest'
      responses:
        '200':
          description: Updated team details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'

  /missions:
    get:
      tags: [Missions]
      summary: List missions.
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/MissionStatus'
      responses:
        '200':
          description: Mission list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mission'
    post:
      tags: [Missions]
      summary: Create mission (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMissionRequest'
      responses:
        '201':
          description: Mission created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'

  /missions/current:
    get:
      tags: [Missions]
      summary: Get current active mission.
      responses:
        '200':
          description: Active mission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '404':
          $ref: '#/components/responses/NotFound'

  /missions/{id}:
    get:
      tags: [Missions]
      summary: Get mission by id.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Mission details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
    patch:
      tags: [Missions]
      summary: Update mission (admin only).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMissionRequest'
      responses:
        '200':
          description: Updated mission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
    delete:
      tags: [Missions]
      summary: Delete mission (admin only).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Mission deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'

  /missions/{id}/publish:
    post:
      tags: [Missions]
      summary: Publish mission (admin only).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Published mission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'

  /challenges:
    get:
      tags: [Challenges]
      summary: List challenges.
      responses:
        '200':
          description: Challenge list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Challenge'
    post:
      tags: [Challenges]
      summary: Create challenge (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChallengeRequest'
      responses:
        '201':
          description: Challenge created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'

  /challenges/{id}:
    get:
      tags: [Challenges]
      summary: Get challenge detail.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Challenge details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
    patch:
      tags: [Challenges]
      summary: Update challenge (admin only).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChallengeRequest'
      responses:
        '200':
          description: Updated challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'

  /challenges/{id}/start:
    post:
      tags: [Challenges]
      summary: Start a challenge (admin only).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Live challenge state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'

  /challenges/{id}/stop:
    post:
      tags: [Challenges]
      summary: Stop a challenge (admin only).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Stopped challenge state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'

  /challenges/{id}/rounds:
    get:
      tags: [Challenges]
      summary: List rounds for a challenge.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Round list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Round'
    post:
      tags: [Challenges]
      summary: Add challenge round (admin only).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoundRequest'
      responses:
        '201':
          description: Created round.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Round'

  /submissions:
    get:
      tags: [Submissions]
      summary: List submissions.
      parameters:
        - in: query
          name: challengeId
          schema:
            type: string
        - in: query
          name: teamId
          schema:
            type: string
      responses:
        '200':
          description: Submission list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Submission'
    post:
      tags: [Submissions]
      summary: Submit challenge answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswerRequest'
      responses:
        '201':
          description: Submission created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'

  /submissions/{id}/upload:
    post:
      tags: [Submissions]
      summary: Attach file to submission.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'

  /leaderboard:
    get:
      tags: [Leaderboard]
      summary: Current team standings.
      responses:
        '200':
          description: Leaderboard entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardEntry'

  /leaderboard/weekly:
    get:
      tags: [Leaderboard]
      summary: Weekly standings.
      parameters:
        - in: query
          name: week
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Weekly leaderboard entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardEntry'

  /leaderboard/history:
    get:
      tags: [Leaderboard]
      summary: Historical weekly leaderboard snapshots.
      responses:
        '200':
          description: Weekly snapshots.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [weekNumber, entries]
                  properties:
                    weekNumber:
                      type: integer
                    entries:
                      type: array
                      items:
                        $ref: '#/components/schemas/LeaderboardEntry'

  /leaderboard/individual:
    get:
      tags: [Leaderboard]
      summary: Individual student standings.
      responses:
        '200':
          description: Individual leaderboard entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndividualRanking'

  /scores:
    get:
      tags: [Scores]
      summary: List score entries.
      parameters:
        - in: query
          name: challengeId
          schema:
            type: string
      responses:
        '200':
          description: Score list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Score'
    post:
      tags: [Scores]
      summary: Enter score (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScoreRequest'
      responses:
        '201':
          description: Score created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Score'

  /scores/{id}:
    patch:
      tags: [Scores]
      summary: Update score (admin only).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScoreRequest'
      responses:
        '200':
          description: Updated score.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Score'

  /awards:
    get:
      tags: [Awards]
      summary: List award definitions.
      responses:
        '200':
          description: Awards.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Award'
    post:
      tags: [Awards]
      summary: Create award (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAwardRequest'
      responses:
        '201':
          description: Award created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Award'

  /awards/winners:
    get:
      tags: [Awards]
      summary: List award winners.
      responses:
        '200':
          description: Award winners.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AwardWinner'

  /awards/{id}/nominate:
    post:
      tags: [Awards]
      summary: Nominate a user for an award.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NominateAwardRequest'
      responses:
        '200':
          description: Nomination accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'

  /awards/{id}/winner:
    post:
      tags: [Awards]
      summary: Declare award winner (admin only).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclareWinnerRequest'
      responses:
        '200':
          description: Winner declared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwardWinner'

  /notifications:
    get:
      tags: [Notifications]
      summary: List current user's notifications.
      responses:
        '200':
          description: Notification list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark one notification as read.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Updated notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all notifications as read.
      responses:
        '200':
          description: Read state updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'

  /season:
    get:
      tags: [Season]
      summary: Get active season settings.
      responses:
        '200':
          description: Active season.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
    patch:
      tags: [Season]
      summary: Update season settings (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSeasonRequest'
      responses:
        '200':
          description: Updated season.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Action not allowed for current role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiMessage:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string

    ApiError:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    RegisterRequest:
      type: object
      required: [email, fullName, studentId, password]
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
          minLength: 2
        studentId:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 8

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8

    SetupPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8

    RefreshTokenRequest:
      type: object
