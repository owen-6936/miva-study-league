x-socketio-events:
  namespace: /
  clientEmits:
    - event: authenticate
      payload:
        type: object
        required: [token]
        properties:
          token:
            type: string
    - event: timer:requestSync
      payload:
        type: object
        additionalProperties: false
  serverEmits:
    - event: leaderboard:update
      payload:
        type: array
        items:
          $ref: '#/components/schemas/LeaderboardEntry'
    - event: challenge:started
      payload:
        type: object
        required: [challengeId, roundId, endsAt]
        properties:
          challengeId:
            type: string
          roundId:
            type: string
          endsAt:
            type: string
            format: date-time
    - event: challenge:tick
      payload:
        type: object
        required: [remainingSeconds]
        properties:
          remainingSeconds:
            type: integer
    - event: challenge:ended
      payload:
        type: object
        required: [challengeId, results]
        properties:
          challengeId:
            type: string
          results:
            type: array
            items:
              $ref: '#/components/schemas/LeaderboardEntry'
    - event: score:update
      payload:
        type: object
        required: [teamId, roundId, points, totalPoints]
        properties:
          teamId:
            type: string
          roundId:
            type: string
          points:
            type: integer
          totalPoints:
            type: integer
    - event: notification:new
      payload:
        $ref: '#/components/schemas/Notification'
    - event: timer:sync
      payload:
        type: object
        required: [remainingSeconds, serverTime]
        properties:
          remainingSeconds:
            type: integer
          serverTime:
            type: string
            format: date-time
